# Configuration template only. Actual credentials belong in the hosting Secrets UI.
# Never commit .streamlit/secrets.toml.
DATATHON_AWS_REGION = "us-east-1"
DATATHON_PROFILE_MODEL_ID = "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
AWS_DEFAULT_REGION = "us-east-1"
AWS_EC2_METADATA_DISABLED = "true"
DATATHON_PUBLIC_FALLBACK = "0"

# Optional approved ZIP, stored privately. Configure both values together.
# DATATHON_PRICE_ARCHIVE_S3_URI = "s3://your-private-bucket/market-snapshot.zip"
# DATATHON_PRICE_ARCHIVE_SHA256 = "sha256-digest-of-the-zip"

# Add valid credentials directly in Streamlit Cloud's Secrets editor.
# Temporary sessions require all three fields and stop working when they expire.
# AWS_ACCESS_KEY_ID = "..."
# AWS_SECRET_ACCESS_KEY = "..."
# AWS_SESSION_TOKEN = "..."
